name: Build Goo Engine v3.6
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SVN
        run: choco install svn -y

      - name: Download Libs (Resilient Mode)
        shell: cmd
        run: |
          mkdir ..\lib
          cd ..\lib
          :: We use a loop to retry if the server hits us with a 429
          set max_retries=5
          set count=0
          
          :loop
          svn export https://svn.blender.org/svnroot/bf-blender/tags/blender-3.6-release/lib/win64_vc15 . --force --quiet
          if %errorlevel% neq 0 (
              set /a count+=1
              if %count% geq %max_retries% (
                  echo "Failed after %max_retries% attempts."
                  exit /b 1
              )
              echo "Server busy (429). Waiting 60 seconds before retry %count%..."
              timeout /t 60
              goto loop
          )
          
      - name: Build
        shell: cmd
        run: call make.bat release

      - name: Zip and Upload
        shell: cmd
        run: |
          mkdir Goo_Dist
          xcopy /E /I ..\build_windows_Release_x64_vc17\bin\Release\* .\Goo_Dist\
          powershell Compress-Archive -Path .\Goo_Dist\* -DestinationPath GooEngine_v3.6.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows-Build
          path: GooEngine_v3.6.zip
