name: Build Goo Engine v3.6
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Maximize Disk Space
        shell: pwsh
        run: |
          # Removing heavy pre-installed tools to give Blender ~30GB of extra room
          Write-Host "Cleaning up disk space..."
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft SDKs" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\android" -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SVN
        run: choco install svn -y

      - name: Download Libs
        shell: cmd
        run: |
          if not exist "D:\a\goo-engine-\lib\win64_vc15" mkdir "D:\a\goo-engine-\lib\win64_vc15"
          
          :: Attempt 1
          svn export https://svn.blender.org/svnroot/bf-blender/tags/blender-3.6-release/lib/win64_vc15 "D:\a\goo-engine-\lib\win64_vc15" --force --quiet || (
            echo "Server busy. Waiting 90 seconds..."
            powershell -Command "Start-Sleep -s 90"
            
            :: Attempt 2
            svn export https://svn.blender.org/svnroot/bf-blender/tags/blender-3.6-release/lib/win64_vc15 "D:\a\goo-engine-\lib\win64_vc15" --force --quiet || (
              echo "Still busy. Final wait 120 seconds..."
              powershell -Command "Start-Sleep -s 120"
              
              :: Final Attempt
              svn export https://svn.blender.org/svnroot/bf-blender/tags/blender-3.6-release/lib/win64_vc15 "D:\a\goo-engine-\lib\win64_vc15" --force --quiet
            )
          )

      - name: Build Goo Engine
        shell: cmd
        run: |
          :: Navigate to source and build
          cd D:\a\goo-engine-\goo-engine-
          call make.bat release

      - name: Prepare Shareable Zip
        if: success()
        shell: cmd
        run: |
          mkdir Goo_Dist
          :: Copy the built files (using the dash-named path from your logs)
          xcopy /E /I D:\a\goo-engine-\build_windows_Release_x64_vc17_Release\bin\Release\* .\Goo_Dist\
          powershell Compress-Archive -Path .\Goo_Dist\* -DestinationPath GooEngine_v3.6.zip

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows-Build
          path: GooEngine_v3.6.zip
          retention-days: 7
