name: Build Goo Engine v3.6
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SVN
        run: choco install svn -y

      - name: Download Libs
        shell: cmd
        run: |
          :: Create the exact folder the error is asking for
          mkdir "D:\a\goo-engine-\lib\win64_vc15"
          
          :: Download directly into that folder
          svn export https://svn.blender.org/svnroot/bf-blender/tags/blender-3.6-release/lib/win64_vc15 "D:\a\goo-engine-\lib\win64_vc15" --force
          
      - name: Build
        shell: cmd
        run: |
          cd %GITHUB_WORKSPACE%
          call make.bat release

      - name: Prepare Shareable Zip
        shell: cmd
        run: |
          mkdir Goo_Dist
          :: Added the dash after 'goo-engine' to match your runner's path
          xcopy /E /I D:\a\goo-engine-\build_windows_Release_x64_vc17\bin\Release\* .\Goo_Dist\
          powershell Compress-Archive -Path .\Goo_Dist\* -DestinationPath GooEngine_v3.6.zip
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows-Build
          path: GooEngine_v3.6.zip
